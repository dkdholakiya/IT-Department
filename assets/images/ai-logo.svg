<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <style>
      /* 1. Weightless Floating Levitation Animation for AI Visor */
      @keyframes botFloat {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-2px) rotate(0.6deg);
        }
      }

      /* 2. Natural Lifelike Eye Blink Animation */
      @keyframes eyeBlink {
        0%, 86%, 94%, 100% {
          transform: scaleY(1);
          opacity: 1;
        }
        90% {
          transform: scaleY(0.08);
          opacity: 0.6;
        }
      }

      .floating-bot {
        animation: botFloat 2.8s ease-in-out infinite;
        transform-origin: 50px 50px;
      }

      .bot-eye {
        animation: eyeBlink 3.8s ease-in-out infinite;
        transform-origin: center;
        transform-box: fill-box;
      }
    </style>
  </defs>

  <!-- 1. Outer Circle Outline (Dual-Tone Silver & Pure White Neon Ring — 100% Transparent Background) -->
  <circle cx="50" cy="50" r="45.5" stroke="#C3C8D2" stroke-width="1.4" />
  <circle cx="50" cy="50" r="44.2" stroke="#FFFFFF" stroke-width="1.8" />
  <circle cx="50" cy="50" r="43.2" stroke="#B0B5C2" stroke-width="0.8" opacity="0.6" />

  <!-- 2. Floating Black & White AI Robot Visor -->
  <g class="floating-bot">
    <!-- Visor Outer Silver Contour -->
    <rect x="27.5" y="38.5" width="45" height="23" rx="11.5" stroke="#C3C8D2" stroke-width="1.2" />

    <!-- Visor Main Pure White Neon Rim -->
    <rect x="28.2" y="39.2" width="43.6" height="21.6" rx="10.8" stroke="#FFFFFF" stroke-width="2.2" />

    <!-- Visor Inner Precision Accent -->
    <rect x="29.6" y="40.6" width="40.8" height="18.8" rx="9.4" stroke="#B0B5C2" stroke-width="0.9" />

    <!-- Deep Jet Black Visor Screen Body -->
    <rect x="30.5" y="41.5" width="39" height="17" rx="8.5" fill="#050508" />

    <!-- Top Visor Glass Sheen Reflection Arc -->
    <path d="M34 44 Q50 41.5 66 44" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.35" />

    <!-- 3. Two Pure White Vertical Pill Eyes -->
    <!-- Left Pill Eye -->
    <rect class="bot-eye" x="42.8" y="44.5" width="4.6" height="11" rx="2.3" fill="#FFFFFF" />

    <!-- Right Pill Eye -->
    <rect class="bot-eye" x="52.6" y="44.5" width="4.6" height="11" rx="2.3" fill="#FFFFFF" />
  </g>
</svg>
