<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Glass Orb Pastel Gradient Fill -->
    <radialGradient id="orbGlassGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FAF0FF" />
      <stop offset="65%" stop-color="#F5DBFF" />
      <stop offset="100%" stop-color="#ECD0FA" />
    </radialGradient>

    <!-- Center Violet/Purple Radial Bloom -->
    <radialGradient id="centerBloomGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>

    <!-- Electric Neon Purple Halo Filter -->
    <filter id="neonPurpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.2" result="blur1" />
      <feGaussianBlur stdDeviation="1.6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Eye Glow Filter -->
    <filter id="eyeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* 1. Weightless Floating Levitation */
      @keyframes floatAnim {
        0%, 100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-2.2px) rotate(0.8deg);
        }
      }

      /* 2. Neon Breathing Glow */
      @keyframes breatheGlow {
        0%, 100% {
          opacity: 0.85;
          filter: drop-shadow(0 0 2px rgba(139, 92, 246, 0.7));
        }
        50% {
          opacity: 1;
          filter: drop-shadow(0 0 4.5px rgba(147, 51, 234, 0.95));
        }
      }

      /* 3. Natural Lifelike Eye Blink */
      @keyframes blinkAnim {
        0%, 86%, 94%, 100% {
          transform: scaleY(1);
          opacity: 1;
        }
        90% {
          transform: scaleY(0.08);
          opacity: 0.6;
        }
      }

      .floating-group {
        animation: floatAnim 2.8s ease-in-out infinite;
        transform-origin: 50px 50px;
      }

      .neon-rim {
        animation: breatheGlow 3.2s ease-in-out infinite;
      }

      .robot-eye {
        animation: blinkAnim 3.8s ease-in-out infinite;
        transform-origin: center;
        transform-box: fill-box;
      }
    </style>
  </defs>

  <!-- 1. Circular Frosted Glass Orb -->
  <circle cx="50" cy="50" r="45" fill="url(#orbGlassGrad)" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.95" />

  <!-- 2. Center Radial Violet Bloom -->
  <circle cx="50" cy="50" r="34" fill="url(#centerBloomGrad)" />

  <!-- 3. Floating Visor Robot Group -->
  <g class="floating-group">
    <!-- Outer Neon Purple Glow Halo behind Visor -->
    <rect x="27.5" y="38.5" width="45" height="23" rx="11.5" fill="#8B5CF6" opacity="0.6" filter="url(#neonPurpleGlow)" />

    <!-- Outermost Bright White Neon Stroke -->
    <rect x="28" y="39" width="44" height="22" rx="11" fill="none" stroke="#FFFFFF" stroke-width="1.5" class="neon-rim" />

    <!-- Inner Electric Violet Border -->
    <rect x="29.2" y="40.2" width="41.6" height="19.6" rx="9.8" fill="#08080E" stroke="#9333EA" stroke-width="1.6" />

    <!-- Top Visor Glass Sheen Highlight -->
    <path d="M33 42 Q50 39.5 67 42" fill="none" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" opacity="0.32" />

    <!-- 4. Two Glowing Pure White Vertical Pill Eyes -->
    <!-- Left Pill Eye -->
    <rect class="robot-eye" x="42.8" y="44.2" width="5.0" height="11.4" rx="2.5" fill="#FFFFFF" filter="url(#eyeGlow)" />
    <!-- Right Pill Eye -->
    <rect class="robot-eye" x="52.2" y="44.2" width="5.0" height="11.4" rx="2.5" fill="#FFFFFF" filter="url(#eyeGlow)" />
  </g>
</svg>
